<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2A900"/>
      <stop offset="50%" style="stop-color:#FFC845"/>
      <stop offset="100%" style="stop-color:#C98700"/>
    </linearGradient>
    <linearGradient id="beeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#8B4513"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal honeycomb background -->
  <polygon points="32,2 58,16 58,48 32,62 6,48 6,16"
           fill="url(#honeyGrad)"
           stroke="#1a0f08"
           stroke-width="2"/>

  <!-- Central honey drop -->
  <ellipse cx="32" cy="40" rx="16" ry="14"
           fill="#FFD700" opacity="0.9"/>
  <ellipse cx="32" cy="42" rx="10" ry="8"
           fill="#FFF8E7" opacity="0.6"/>

  <!-- Bee silhouette (simplified) -->
  <ellipse cx="32" cy="32" rx="8" ry="6" fill="url(#beeGrad)"/>
  <circle cx="28" cy="31" r="2" fill="#1a0f08"/>
  <circle cx="36" cy="31" r="2" fill="#1a0f08"/>
  <ellipse cx="22" cy="32" rx="2" ry="3" fill="#8B4513" opacity="0.8"/>
  <ellipse cx="42" cy="32" rx="2" ry="3" fill="#8B4513" opacity="0.8"/>

  <!-- Wings hint -->
  <ellipse cx="26" cy="27" rx="4" ry="2" fill="#FFF" opacity="0.7"/>
  <ellipse cx="38" cy="27" rx="4" ry="2" fill="#FFF" opacity="0.7"/>
</svg>