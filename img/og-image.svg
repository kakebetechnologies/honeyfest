<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C1810"/>
      <stop offset="50%" style="stop-color:#3a2015"/>
      <stop offset="100%" style="stop-color:#1a0f08"/>
    </linearGradient>
    <linearGradient id="honeyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC845"/>
      <stop offset="50%" style="stop-color:#F2A900"/>
      <stop offset="100%" style="stop-color:#C98700"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative honeycomb pattern (subtle) -->
  <g opacity="0.1">
    <polygon points="100,100 140,120 140,160 100,180 60,160 60,120" stroke="#F2A900" fill="none" stroke-width="2"/>
    <polygon points="200,80 240,100 240,140 200,160 160,140 160,100" stroke="#F2A900" fill="none" stroke-width="2"/>
    <polygon points="900,200 940,220 940,260 900,280 860,260 860,220" stroke="#F2A900" fill="none" stroke-width="2"/>
    <polygon points="1000,300 1040,320 1040,360 1000,380 960,360 960,320" stroke="#F2A900" fill="none" stroke-width="2"/>
  </g>

  <!-- Main festival title -->
  <text x="600" y="200"
        font-family="Fraunces, serif"
        font-size="96"
        font-weight="900"
        fill="#FFD700"
        text-anchor="middle"
        filter="url(#glow)">
    GULU HONEY FESTIVAL
  </text>

  <!-- Date badge -->
  <rect x="350" y="250" width="500" height="80" rx="40" fill="url(#honeyGold)"/>
  <text x="600" y="300"
        font-family="Poppins, sans-serif"
        font-size="42"
        font-weight="700"
        fill="#1a0f08"
        text-anchor="middle">
    🗓️ 16th May 2026 · Kaunda Ground, Gulu
  </text>

  <!-- Tagline -->
  <text x="600" y="400"
        font-family="Fraunces, serif"
        font-size="36"
        font-weight="600"
        fill="#FFC845"
        text-anchor="middle"
        font-style="italic">
    Sweet Harmony: Celebrating Bees & Nature
  </text>

  <!-- Bottom CTA -->
  <text x="600" y="500"
        font-family="Poppins, sans-serif"
        font-size="28"
        font-weight="500"
        fill="#FFF8E7"
        text-anchor="middle">
    Join 200+ Beekeepers · Cultural Shows · Honey Tasting
  </text>

  <!-- Decorative bee -->
  <g transform="translate(180, 130) scale(1.5)" opacity="0.9">
    <ellipse cx="30" cy="32" rx="14" ry="10" fill="#F2A900" opacity="0.9"/>
    <ellipse cx="30" cy="32" rx="14" ry="10" fill="#FFC845" opacity="0.6"/>
    <circle cx="20" cy="28" r="5" fill="#1a0f08" opacity="0.9"/>
    <circle cx="40" cy="28" r="5" fill="#1a0f08" opacity="0.9"/>
    <circle cx="18" cy="26" r="2" fill="#FFD700"/>
    <circle cx="38" cy="26" r="2" fill="#FFD700"/>
    <path d="M10 30 Q5 35 8 42 Q5 48 12 50 Q15 45 18 43" fill="#8B4513" opacity="0.8"/>
    <path d="M50 30 Q55 35 52 42 Q55 48 48 50 Q45 45 42 43" fill="#8B4513" opacity="0.8"/>
    <circle cx="14" cy="12" r="4" fill="#F2A900" opacity="0.7"/>
    <circle cx="46" cy="12" r="4" fill="#F2A900" opacity="0.7"/>
  </g>

  <g transform="translate(950, 380) scale(1.2)" opacity="0.85">
    <ellipse cx="30" cy="32" rx="14" ry="10" fill="#FFC845" opacity="0.9"/>
    <ellipse cx="30" cy="32" rx="14" ry="10" fill="#F2A900" opacity="0.6"/>
    <circle cx="20" cy="28" r="5" fill="#1a0f08" opacity="0.9"/>
    <circle cx="40" cy="28" r="5" fill="#1a0f08" opacity="0.9"/>
    <circle cx="18" cy="26" r="2" fill="#FFD700"/>
    <circle cx="38" cy="26" r="2" fill="#FFD700"/>
    <path d="M10 30 Q5 35 8 42 Q5 48 12 50 Q15 45 18 43" fill="#8B4513" opacity="0.8"/>
    <path d="M50 30 Q55 35 52 42 Q55 48 48 50 Q45 45 42 43" fill="#8B4513" opacity="0.8"/>
    <circle cx="14" cy="12" r="4" fill="#FFD700" opacity="0.7"/>
    <circle cx="46" cy="12" r="4" fill="#FFD700" opacity="0.7"/>
  </g>

  <!-- Website URL -->
  <text x="600" y="590"
        font-family="Poppins, sans-serif"
        font-size="24"
        font-weight="500"
        fill="#C98700"
        text-anchor="middle">
    guluhoneyfestival.ug
  </text>

  <!-- Honey drops decoration -->
  <circle cx="80" cy="500" r="12" fill="#F2A900" opacity="0.4"/>
  <circle cx="1120" cy="100" r="8" fill="#FFC845" opacity="0.5"/>
  <circle cx="150" cy="250" r="6" fill="#F2A900" opacity="0.3"/>
</svg>